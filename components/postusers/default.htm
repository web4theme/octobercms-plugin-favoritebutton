<ul class="postusers" id="{{ __SELF__.id }}">
    {% for user in users %}
        <li>
            {% if user.avatar %}
                <img class="postuseravt" src="{{ user.avatar.getPath }}" alt="{{ user.name }}">
            {% else %}
                <img class="postuseravt" src="/plugins/baba/favoritebutton/assets/user-tie-solid.svg" alt="{{ user.name }}">
            {% endif %}
        </li>
    {% endfor %}
</ul>
